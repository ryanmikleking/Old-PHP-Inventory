<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      type="image/png"
      href="../assets/icons/inventory-filled-outline-icon-design-illustration-manufacturing-units-symbol-on-white-background-eps-10-file-vector.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/icons/inventory-filled-outline-icon-design-illustration-manufacturing-units-symbol-on-white-background-eps-10-file-vector.ico"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create User | PHP Sign In Page</title>
      <link rel="stylesheet" href="../assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main>
      <div class="login-div">
        <div class="input-box-header">
          <span class="login-box-title">Create User</span>
          <div class="close" id="close-btn">
            <img src="../assets/icons/x-lg.svg" alt="close" />
          </div>
        </div>
        <h1 class="login-title">Sign In</h1>
        <div class="form-content">
          <form method="POST" id="login-form-cu" class="login-form">
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div>
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>

            <button type="submit">Create User</button>

            <p id="message-cu"></p>
          </form>
          <div class="close-display" id="close-display">
            Sorry, you cannot close the login screen!
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="../assets/js/create-user.js"></script>
  <script src="../assets/js/close-btn.js"></script>
  </body>
</html>
